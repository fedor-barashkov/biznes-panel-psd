<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бизнес-панель ПСД</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: окно Windows 11 (Fluent) — заголовок, боковое меню модулей, рабочая область; светлая и тёмная тема */
:root{
  --bg:#f3f3f3;--surface:#ffffff;--surface-2:#f7f7f7;--side:#ebebeb;--title:#ebebeb;--line:#e1e1e1;
  --fg:#1b1b1b;--fg-2:#5d5d5d;--fg-3:#8a8a8a;
  --accent:#005fb8;--accent-fg:#ffffff;--accent-soft:#e3eefa;
  --ok:#0f7b0f;--ok-soft:#e3f2e3;--warn:#8a5300;--warn-soft:#fff1c7;--bad:#c42b1c;--bad-soft:#fde7e9;--info:#005fb8;--info-soft:#e3eefa;
  --r:8px;--r-sm:4px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 6px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#202020;--surface:#2b2b2b;--surface-2:#323232;--side:#1c1c1c;--title:#1c1c1c;--line:#3b3b3b;
  --fg:#f3f3f3;--fg-2:#c8c8c8;--fg-3:#9a9a9a;
  --accent:#60cdff;--accent-fg:#00283d;--accent-soft:#1d3747;
  --ok:#7fd572;--ok-soft:#1e3320;--warn:#ffd75e;--warn-soft:#3a3212;--bad:#ff9aa4;--bad-soft:#47272a;--info:#60cdff;--info-soft:#1d3747;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#202020;--surface:#2b2b2b;--surface-2:#323232;--side:#1c1c1c;--title:#1c1c1c;--line:#3b3b3b;
  --fg:#f3f3f3;--fg-2:#c8c8c8;--fg-3:#9a9a9a;
  --accent:#60cdff;--accent-fg:#00283d;--accent-soft:#1d3747;
  --ok:#7fd572;--ok-soft:#1e3320;--warn:#ffd75e;--warn-soft:#3a3212;--bad:#ff9aa4;--bad-soft:#47272a;--info:#60cdff;--info-soft:#1d3747;
  --shadow:none;color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;display:grid;grid-template-rows:auto 1fr;height:100%;overflow:hidden}

.titlebar{display:flex;align-items:center;gap:12px;background:var(--title);border-bottom:1px solid var(--line);padding-block:6px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));min-height:46px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:700;white-space:nowrap}
.brand-mark{width:24px;height:24px;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:11px;font-weight:700}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;color:var(--fg-3)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--fg)}
.search kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{border:0;background:transparent;width:34px;height:34px;border-radius:var(--r);display:grid;place-items:center;cursor:pointer;color:var(--fg-2);position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.win{display:flex;margin-left:6px}
.win span{width:44px;height:34px;display:grid;place-items:center;color:var(--fg-2)}
.win span:last-child:hover{background:#c42b1c;color:#fff}
.sample{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}

.shell{display:grid;grid-template-columns:250px 1fr;min-height:0}
.side{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:12px 10px 20px;display:flex;flex-direction:column;gap:14px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);padding:0 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r);border:0;background:transparent;cursor:pointer;text-align:left;color:var(--fg-2);position:relative;width:100%}
.nav-item:hover{background:var(--surface-2);color:var(--fg)}
.nav-item[aria-current="page"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}
.nav-ico{width:24px;height:24px;display:grid;place-items:center;color:var(--accent);flex:none}
.nav-item .count{margin-left:auto;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;border:1px dashed var(--line);border-radius:var(--r);padding:10px;font-size:12px;color:var(--fg-2);display:flex;gap:8px;align-items:flex-start}
.side-foot b{color:var(--fg)}

.main{overflow:auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1260px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
@media (min-width:861px){.main{padding-left:28px;padding-right:28px}}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;color:var(--fg-3);margin-bottom:2px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.2}
h2{font-size:16px}
h3{font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--fg-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn svg,.icon-btn svg,.nav-ico svg{width:17px;height:17px}
.btn.sm svg{width:14px;height:14px}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head .sub{font-size:12px;color:var(--fg-3)}

.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .label{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.kpi .label svg{width:15px;height:15px;color:var(--accent)}
.kpi .value{font-family:var(--font-d);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .delta{font-size:12px;color:var(--fg-3)}
.kpi .delta.up{color:var(--ok)}.kpi .delta.down{color:var(--bad)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--fg-3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--fg-3)}
.small{font-size:12px}
.code{font-family:var(--mono);font-size:12px;color:var(--fg-2);white-space:nowrap}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--fg-2)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--fg-2);margin-right:4px;white-space:nowrap}

.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.done i{background:var(--ok)}
.prog{display:flex;align-items:center;gap:8px}
.prog span{font-variant-numeric:tabular-nums;font-size:12px;color:var(--fg-2);min-width:32px;text-align:right}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ico{width:30px;height:30px;border-radius:var(--r-sm);background:var(--surface-2);display:grid;place-items:center;color:var(--fg-2);flex:none}
.li .ico svg{width:16px;height:16px}
.li .body{flex:1;min-width:0}
.li .t{font-weight:600}
.li .m{font-size:12px;color:var(--fg-3)}
.li .r{margin-left:auto;text-align:right;flex:none}

.ai-tip{display:flex;gap:14px;align-items:center;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;flex-wrap:wrap}
.ai-tip .t{flex:1;min-width:220px}
.ai-tip > svg{color:var(--accent)}

.chart text{fill:var(--fg-3);font-size:11px;font-family:var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent);opacity:.45}
.chart .b.last{opacity:1}
.chart .b2{fill:var(--fg-3);opacity:.35}
.legend{display:flex;gap:14px;font-size:12px;color:var(--fg-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;cursor:pointer;color:var(--fg-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button svg{width:15px;height:15px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs button .n{font-size:11px;color:var(--fg-3);font-weight:400}

.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.secnav{display:flex;flex-direction:column;gap:4px}
.sec{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.sec:hover{border-color:var(--fg-3)}
.sec[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sec .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.sec b{font-weight:600}

.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2);font-weight:600;padding:0 2px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.kcard .sum{font-variant-numeric:tabular-nums;font-size:13px}

.integr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.integ{display:flex;flex-direction:column;gap:10px}
.integ-h{display:flex;align-items:center;gap:10px}
.integ-h .ico{width:36px;height:36px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.integ p{margin:0;color:var(--fg-2);font-size:13px}
.switch{margin-left:auto;width:38px;height:22px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.ai-search{display:flex;flex-direction:column;gap:12px}
.ai-search form{display:flex;gap:8px;flex-wrap:wrap}
.ai-search input{flex:1;min-width:220px;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:9px 12px}
.best td{background:var(--ok-soft)}
.tree{font-size:13px;display:flex;flex-direction:column;gap:2px}
.tree div{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:var(--r-sm)}
.tree div:hover{background:var(--surface-2)}
.tree svg{width:16px;height:16px;color:var(--fg-3);flex:none}
.tree .d1{padding-left:26px}.tree .d2{padding-left:46px}

.drawer{position:absolute;top:46px;right:0;bottom:0;width:380px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);display:flex;flex-direction:column;z-index:20;padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer-h h2{flex:1}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:var(--r);font-size:13px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg)}
.msg.ai{align-self:flex-start;background:var(--surface-2)}
.msg ul{margin:6px 0 0;padding-left:18px}
.composer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:8px 10px}
.overlay{position:absolute;inset:0;background:rgba(10,12,20,.42);display:grid;place-items:center;z-index:30;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:min(640px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.opt{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt svg{color:var(--accent);width:20px;height:20px}
.opt b{font-size:13px}.opt span{font-size:12px;color:var(--fg-3)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-2)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;color:var(--fg)}
.toast{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}

.zones{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:2px;flex:none}
.zones button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--fg-2);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.zones button svg{width:15px;height:15px}
.zones button:hover{color:var(--fg)}
.zones button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
.zones button[aria-selected="true"] svg{color:var(--accent)}
.zone-head{display:flex;gap:10px;align-items:center;padding:2px 10px 0}
.zone-head .zi{width:32px;height:32px;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.zone-head .zi svg{width:18px;height:18px}
.zone-head b{display:block;font-family:var(--font-d);font-size:15px}
.zone-head span{font-size:12px;color:var(--fg-3)}
.opts-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);margin:4px 0 -4px}
.search{position:relative}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:25;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:min(60vh,460px);overflow:auto;padding:6px;color:var(--fg)}
.sres .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);padding:8px 8px 4px}
.sres button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer}
.sres button:hover,.sres button[aria-selected="true"]{background:var(--accent-soft)}
.sres button svg{width:16px;height:16px;color:var(--accent);flex:none;margin-top:2px}
.sres .st{font-weight:600;font-size:13px}.sres .ss{font-size:12px;color:var(--fg-3)}
.sres mark{background:var(--warn-soft);color:inherit;border-radius:2px}
.sres .none{padding:14px 8px;color:var(--fg-3);font-size:13px}
.form .checks{display:flex;flex-wrap:wrap;gap:6px}
.form .checks label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;color:var(--fg);cursor:pointer}
.form .hint{font-size:12px;color:var(--fg-3);grid-column:1/-1;margin:-4px 0 0}
.form .err{color:var(--bad);font-size:12px;grid-column:1/-1}
.msg.ai{white-space:pre-wrap}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.ai-chips .chip{font-size:12px;padding:4px 10px}
.savebadge{font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--fg-2)}
.savebadge.on{background:var(--ok-soft);color:var(--ok)}
.new-row td{background:var(--info-soft)}
.btn[disabled]{opacity:.6;cursor:progress}

function bars(series,W=560,H=200){
  const m=['Май','Июн','Июл','Авг','Сен','Окт'],L=44,B=24,max=2.5,y=x=>H-B-(x/max)*(H-B-10),step=(W-L)/6;
  let g='';for(let t=0;t<=2.5;t+=0.5){g+=`<line class="gl" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t.toLocaleString('ru-RU')}</text>`}
  m.forEach((mm,i)=>{const cx=L+step*i+step/2;
    if(series.length===1){const v=series[0][i];g+=`<rect class="b ${i===5?'last':''}" x="${cx-23}" y="${y(v)}" width="46" height="${y(0)-y(v)}" rx="3"/>`;if(i===5)g+=`<text x="${cx}" y="${y(v)-6}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${v.toLocaleString('ru-RU')}</text>`}
    else{g+=`<rect class="b last" x="${cx-24}" y="${y(series[0][i])}" width="22" height="${y(0)-y(series[0][i])}" rx="2"/><rect class="b2" x="${cx+2}" y="${y(series[1][i])}" width="22" height="${y(0)-y(series[1][i])}" rx="2"/>`}
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${mm}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Деньги по месяцам, млн рублей">${g}</svg>`;
}

function invTable(rows){return `<table><thead><tr><th>Счёт</th><th>Дата</th><th>Заказчик</th><th class="num">Сумма</th><th>Оплатить до</th><th>Статус</th></tr></thead><tbody>${rows.map(c=>`<tr><td class="code">${c.n}</td><td class="num">${c.date}</td><td>${c.client}</td><td class="num">${rub(c.sum)}</td><td class="num">${c.due}</td><td>${pill(c.status)}</td></tr>`).join('')}</tbody></table>`}
function opsTable(rows){return `<div class="tbl-wrap"><table><thead><tr><th>Дата</th><th>Банк</th><th>Контрагент</th><th>Назначение</th><th>Привязка</th><th class="num">Сумма</th></tr></thead><tbody>${rows.map(o=>`<tr><td class="num">${o[0]}</td><td class="small">${o[1]}</td><td>${o[2]}</td><td class="small">${o[3]}</td><td><span class="tag">${o[5]}</span></td><td class="num" style="color:${o[4]>0?'var(--ok)':'var(--fg)'}">${o[4]>0?'+':'−'}${rub(Math.abs(o[4]))}</td></tr>`).join('')}</tbody></table></div>`}
function teamTable(rows){return `<div class="tbl-wrap"><table><thead><tr><th>Исполнитель</th><th>Специализация</th><th>Форма</th><th>Объекты</th><th class="num">Рейтинг</th><th class="num">К оплате</th><th>Доступ</th></tr></thead><tbody>${rows.map(t=>`<tr><td><b>${t[0]}</b></td><td>${t[1]}</td><td class="small">${t[2]}</td><td class="small">${t[3].map(objName).join(', ')}</td><td class="num">${t[5]}</td><td class="num">${t[4]?rub(t[4]):'—'}</td><td><span class="tag">Только свои объекты</span></td></tr>`).join('')}</tbody></table></div>`}

itd(o){
  if(!ITD[o.id])return empty('ИТД не входит в договор по этому объекту.','Добавить комплект ИТД');
  const keys=Object.keys(ITD_LIB).filter(k=>ITD[o.id][k]);if(!keys.includes(S.sec))S.sec=keys[0];

  const r=await SAMPLE(msgs,{cache:false,modelTier:'default',onText:({text})=>{if(text){out.textContent=text;$('#msgs').scrollTop=$('#msgs').scrollHeight}}});
  out.textContent=r.text||'Ответ пустой. Переформулируйте вопрос.';
  aiHist=[...msgs,{role:'assistant',content:r.text||''}];
  if(aiHist.length>13)aiHist=[aiHist[0],aiHist[1],...aiHist.slice(-10)];
 }catch(e){out.classList.add('err');out.textContent=(e&&e.text?e.text+'\n\n':'')+aiErr(e)}
 aiBusy=false;$('#aiForm button').disabled=false;
}

/* ===== События ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-obj],[data-act],[data-otab],[data-sec],[data-pdobj],[data-pobj],[data-ctab],[data-sw],[data-opt],[data-close],[data-q],[data-sr],[data-ask],[data-zone]');
  if(!t)return;
  if(t.dataset.sr!==undefined)return pickSR(+t.dataset.sr);
  if(t.dataset.ask){toggleAI(true);return askAI(t.dataset.ask)}
  if(t.hasAttribute('data-close'))return closeModal();
  if(t.hasAttribute('data-opt'))return openModal(t.dataset.opt||null,MPRE);
  if(t.dataset.zone)return goZone(t.dataset.zone);
  if(t.dataset.go){if(t.dataset.pdobj)S.pdObj=t.dataset.pdobj;return go(t.dataset.go)}
  if(t.dataset.obj)return go('object',t.dataset.obj,t.dataset.tab);
  if(t.dataset.otab){S.otab=t.dataset.otab;return render()}
  if(t.dataset.sec){S.sec=t.dataset.sec;return render()}
  if(t.dataset.pdobj){S.pdObj=t.dataset.pdobj;return render()}
  if(t.dataset.pobj){S.pobj=t.dataset.pobj;return render()}
  if(t.dataset.ctab){S.ctab=t.dataset.ctab;return render()}
  if(t.dataset.q){return runSupplierSearch(t.dataset.q)}
  if(t.dataset.sw){const x=INTEG[+t.dataset.sw];x[3]=!x[3];FLAGS[x[1]]=x[3];render();toast(x[1]+(x[3]?': подключено':': отключено'));if(DB)DB.doc('state/integrations').set({on:FLAGS}).catch(()=>toast('Переключатель не сохранился в базе панели'));else storeLocal();return}
  const a=t.dataset.act;
  if(a==='new'){const k=t.dataset.kind||defaultKind();openModal(k,ctxPre())}
  if(a==='new-aosr')openModal('aosr',S.screen==='object'?{obj:S.obj}:{obj:'o1'});
  if(a==='ai')toggleAI(true);
  if(a==='toast')toast(t.dataset.msg);
});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='aiPurQ')S.aiq=e.target.value});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='genForm')submitForm(e.target);
  if(e.target.id==='aiPur')runSupplierSearch($('#aiPurQ').value);
  if(e.target.id==='aiForm')askAI($('#aiInput').value);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();toggleAI(false)}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus()}
});
function toggleAI(on){$('#drawer').hidden=!on}
$('#aiBtn').onclick=()=>toggleAI($('#drawer').hidden);
$('#aiClose').onclick=()=>toggleAI(false);

const THEMES=['system','light','dark'],TI={system:['monitor','Тема: как в системе'],light:['sun','Тема: светлая'],dark:['moon','Тема: тёмная']};
function setTheme(t){
  S.theme=t;const r=document.documentElement;
  if(t==='system')r.removeAttribute('data-theme');else r.dataset.theme=t;
  const b=$('#themeBtn');b.innerHTML=ic(TI[t][0]);b.setAttribute('aria-label',TI[t][1]);b.title=TI[t][1];
  window.lucide&&lucide.createIcons();
  try{localStorage.setItem('bp-theme',t)}catch(e){}
}
$('#themeBtn').onclick=()=>setTheme(THEMES[(THEMES.indexOf(S.theme)+1)%3]);

let th=null;try{th=localStorage.getItem('bp-theme')}catch(e){}
let zs=null;try{zs=localStorage.getItem('bp-zone')}catch(e){}if(ZONES[zs]){S.zone=zs;S.screen=ZONES[zs].home}
const h=(location.hash||'').slice(1);if(R[h]&&h!=='object'){S.screen=h;S.zone=zoneOf(h)}
if(th)setTheme(th);else S.theme=document.documentElement.dataset.theme||'system';
if(STANDALONE){loadLocal();setSave(false,'В этом браузере');rebuild()}else setSave(false);
if(window.claude&&typeof window.claude.use==='function'){
 window.claude.use('db').then(db=>{
  if(!db){setSave(false,'Локально');return}
  DB=db;setSave(true);
  db.collection('records').orderBy('at').onSnapshot(s=>{RECS=s.docs.map(d=>d.data()).filter(r=>r&&typeof r.kind==='string'&&r.data&&typeof r.data==='object');rebuild()},()=>setSave(false,'Нет связи с базой'));
  db.doc('state/integrations').onSnapshot(s=>{const d=s.exists&&s.data();FLAGS=(d&&d.on&&typeof d.on==='object')?d.on:{};rebuild()},()=>{});
 }).catch(()=>{});
 window.claude.use('sample').then(s=>{SAMPLE=s||null}).catch(()=>{});
}
render();
</script>
