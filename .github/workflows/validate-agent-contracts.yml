name: Validate construction agent contracts

on:
  push:
    branches: [docs/itd-specification]
    paths:
      - "docs/AGENTS/contracts/**"
      - "scripts/validate_agent_contracts.py"
      - "scripts/agent_business_rules.py"
      - "tests/test_agent_business_rules.py"
      - ".github/workflows/validate-agent-contracts.yml"
  pull_request:
    paths:
      - "docs/AGENTS/contracts/**"
      - "scripts/validate_agent_contracts.py"
      - ".github/workflows/validate-agent-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-json-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema[format]==4.25.1"
      - name: Validate schemas and fixtures
        run: python scripts/validate_agent_contracts.py
      - name: Validate business invariants
        run: python -m unittest discover -s tests -p "test_agent_business_rules.py" -v
