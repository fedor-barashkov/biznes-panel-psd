name: ITD bootstrap validation

on:
  pull_request:
    branches: [ "docs/itd-specification" ]
    paths:
      - "ITD.sln"
      - "global.json"
      - "Directory.Build.props"
      - "src/ITD.**"
      - "tests/ITD.Infrastructure.Tests/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ITD.sln
      - name: Test
        run: dotnet test ITD.sln --configuration Release --no-restore
      - name: Build
        run: dotnet build ITD.sln --configuration Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish src/ITD.Desktop/ITD.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/ITD-win-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITD-win-x64
          path: artifacts/ITD-win-x64
